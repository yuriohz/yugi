<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#35251F" flood-opacity=".16"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF5E9"/><stop offset="1" stop-color="#FFFCF7"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><circle cx="1040" cy="-20" r="260" fill="#F3E2D9"/><circle cx="1160" cy="730" r="210" fill="#E8EFDC"/><g transform="translate(95 105)"><g transform="translate(-8.5 -8.5) scale(0.1660)"><path fill="#A7472D" d="M256 52c-111 0-199 72-199 166 0 78 57 138 144 155l-14 65 84-60c103-7 184-78 184-168 0-88-88-158-199-158Z"/><path fill="#F0C764" d="M239 292c-32-7-60-37-62-77 38 6 72 33 85 62 7 15-7 23-23 15Z"/><path fill="#F0C764" d="M278 284c5-37 28-71 65-88 6 39-10 72-39 93-13 9-28 7-26-5Z"/><path fill="#F0C764" d="M245 303c10 7 25 11 40 6-4 17-16 31-33 40-9-13-12-30-7-46Z"/></g><text x="0" y="128" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2" fill="#7D3424">PRIVACY BY DESIGN</text><text x="0" y="185" font-family="Arial" font-size="44" font-weight="700" fill="#35251F">Your key. Your provider.</text><text x="0" y="237" font-family="Arial" font-size="44" font-weight="700" fill="#35251F">Your writing.</text><text x="0" y="285" font-family="Arial" font-size="17" fill="#6B5E56">No WordSaffron account. No developer database.</text><g transform="translate(0 340)"><circle cx="18" cy="18" r="18" fill="#E8EFDC"/><text x="18" y="24" text-anchor="middle" font-family="Arial" font-weight="700" fill="#56704C">✓</text><text x="52" y="15" font-family="Arial" font-size="14" font-weight="700" fill="#35251F">Stored locally</text><text x="52" y="35" font-family="Arial" font-size="12" fill="#6B5E56">Your API key stays in Chrome's local storage.</text><circle cx="18" cy="87" r="18" fill="#E8EFDC"/><text x="18" y="93" text-anchor="middle" font-family="Arial" font-weight="700" fill="#56704C">✓</text><text x="52" y="84" font-family="Arial" font-size="14" font-weight="700" fill="#35251F">Password fields excluded</text><text x="52" y="104" font-family="Arial" font-size="12" fill="#6B5E56">Sensitive password inputs are never read.</text><circle cx="18" cy="156" r="18" fill="#E8EFDC"/><text x="18" y="162" text-anchor="middle" font-family="Arial" font-weight="700" fill="#56704C">✓</text><text x="52" y="153" font-family="Arial" font-size="14" font-weight="700" fill="#35251F">Review before applying</text><text x="52" y="173" font-family="Arial" font-size="12" fill="#6B5E56">Nothing changes without your approval.</text></g></g><g filter="url(#shadow)"><rect x="760" y="154" width="365" height="490" rx="22" fill="#35251F"/><path d="M942 240c-59 0-107 48-107 107v51c0 24 12 47 32 61l75 51 75-51c20-14 32-37 32-61v-51c0-59-48-107-107-107z" fill="#493A33" stroke="#6B5E56" stroke-width="2"/><rect x="892" y="342" width="100" height="88" rx="14" fill="#9C412B"/><path d="M914 342v-24a28 28 0 0156 0v24" fill="none" stroke="#9C412B" stroke-width="14"/><circle cx="942" cy="378" r="10" fill="#fff"/><rect x="938" y="384" width="8" height="22" rx="4" fill="#fff"/><text x="942" y="555" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Designed for transparency</text><text x="942" y="579" text-anchor="middle" font-family="Arial" font-size="10" fill="#D8CABB">You decide where your text is processed.</text></g><text x="16" y="788" font-family="Arial" font-size="10" fill="#6B5E56">DESIGN MOCKUP · NOT A RUNTIME SCREENSHOT</text></svg>