<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#092d26" flood-opacity=".16"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9fbf5"/><stop offset="1" stop-color="#f8fbfa"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#bg)"/><circle cx="1040" cy="-20" r="260" fill="#dff8f0"/><circle cx="1160" cy="730" r="210" fill="#e3f7f1"/><g transform="translate(95 105)"><circle cx="34" cy="34" r="34" fill="#15c39a"/><text x="34" y="45" text-anchor="middle" font-family="Georgia" font-style="italic" font-size="32" font-weight="700" fill="#fff">W</text><text x="0" y="128" font-family="Arial" font-size="15" font-weight="700" letter-spacing="2" fill="#0b9477">PRIVACY BY DESIGN</text><text x="0" y="185" font-family="Arial" font-size="44" font-weight="700" fill="#17362f">Your key. Your provider.</text><text x="0" y="237" font-family="Arial" font-size="44" font-weight="700" fill="#17362f">Your writing.</text><text x="0" y="285" font-family="Arial" font-size="17" fill="#5c716c">No WriteRight account. No developer database.</text><g transform="translate(0 340)"><circle cx="18" cy="18" r="18" fill="#dff7f0"/><text x="18" y="24" text-anchor="middle" font-family="Arial" font-weight="700" fill="#0a9678">✓</text><text x="52" y="15" font-family="Arial" font-size="14" font-weight="700" fill="#253b36">Stored locally</text><text x="52" y="35" font-family="Arial" font-size="12" fill="#667b76">Your API key stays in Chrome's local storage.</text><circle cx="18" cy="87" r="18" fill="#dff7f0"/><text x="18" y="93" text-anchor="middle" font-family="Arial" font-weight="700" fill="#0a9678">✓</text><text x="52" y="84" font-family="Arial" font-size="14" font-weight="700" fill="#253b36">Password fields excluded</text><text x="52" y="104" font-family="Arial" font-size="12" fill="#667b76">Sensitive password inputs are never read.</text><circle cx="18" cy="156" r="18" fill="#dff7f0"/><text x="18" y="162" text-anchor="middle" font-family="Arial" font-weight="700" fill="#0a9678">✓</text><text x="52" y="153" font-family="Arial" font-size="14" font-weight="700" fill="#253b36">Review before applying</text><text x="52" y="173" font-family="Arial" font-size="12" fill="#667b76">Nothing changes without your approval.</text></g></g><g filter="url(#shadow)"><rect x="760" y="154" width="365" height="490" rx="22" fill="#122e29"/><path d="M942 240c-59 0-107 48-107 107v51c0 24 12 47 32 61l75 51 75-51c20-14 32-37 32-61v-51c0-59-48-107-107-107z" fill="#183f37" stroke="#2e6357" stroke-width="2"/><rect x="892" y="342" width="100" height="88" rx="14" fill="#15c39a"/><path d="M914 342v-24a28 28 0 0156 0v24" fill="none" stroke="#15c39a" stroke-width="14"/><circle cx="942" cy="378" r="10" fill="#fff"/><rect x="938" y="384" width="8" height="22" rx="4" fill="#fff"/><text x="942" y="555" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Designed for transparency</text><text x="942" y="579" text-anchor="middle" font-family="Arial" font-size="10" fill="#8facA5">You decide where your text is processed.</text></g><text x="16" y="788" font-family="Arial" font-size="10" fill="#55756b">DESIGN MOCKUP · NOT A RUNTIME SCREENSHOT</text></svg>