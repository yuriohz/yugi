<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102c26" flood-opacity=".14"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbf7"/><stop offset="1" stop-color="#f8faf9"/></linearGradient></defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#172e29}.h1{font-size:22px;font-weight:700;fill:#1d2926}.h2{font-size:14px;font-weight:700;fill:#22332f}.body{font-size:12px;fill:#51625e}.small{font-size:10px;fill:#74817e}.tiny{font-size:8px;fill:#74817e}.green{fill:#0ca784}.white{fill:#fff}.label{font-size:9px;font-weight:700;letter-spacing:1px;fill:#0b8b70}.button{font-size:11px;font-weight:700}.mode{font-size:12px;font-weight:700;fill:#243430}</style><rect width="1440" height="900" fill="url(#bg)"/><circle cx="1340" cy="30" r="240" fill="#dff8f0"/><text x="58" y="64" class="label">WRITERIGHT V2 · DESIGN PREVIEW</text><text x="58" y="104" class="title">Build a mode around the way you work</text><text x="58" y="131" class="body">Custom modes combine your instruction with non-negotiable fidelity and safety rules.</text><g filter="url(#sh)"><rect x="58" y="165" width="1324" height="680" rx="18" fill="#fff"/><rect x="58" y="165" width="1324" height="52" rx="18" fill="#edf1f0"/><rect x="58" y="199" width="1324" height="18" fill="#edf1f0"/><circle cx="84" cy="191" r="6" fill="#ef6c67"/><circle cx="104" cy="191" r="6" fill="#f1bf4b"/><circle cx="124" cy="191" r="6" fill="#51bc77"/><rect x="173" y="179" width="865" height="25" rx="13" fill="#fff"/><text x="194" y="196" class="small">web.whatsapp.com</text><rect x="58" y="217" width="308" height="628" fill="#f5f8f7"/><text x="90" y="261" class="small">ADD A CUSTOM MODE</text><g transform="translate(90 292)"><circle cx="14" cy="14" r="14" fill="#12ad89"/><text x="14" y="18" text-anchor="middle" font-size="9" fill="#fff">✓</text><text x="41" y="18" class="h2">Basics</text><line x1="14" y1="30" x2="14" y2="62" stroke="#b8c5c1"/><circle cx="14" cy="79" r="14" fill="#12ad89"/><text x="14" y="83" text-anchor="middle" font-size="9" fill="#fff">2</text><text x="41" y="83" class="h2">Instructions</text><line x1="14" y1="95" x2="14" y2="127" stroke="#b8c5c1"/><circle cx="14" cy="144" r="14" fill="#fff" stroke="#aab8b4"/><text x="14" y="148" text-anchor="middle" class="small">3</text><text x="41" y="148" class="body">Guardrails</text><line x1="14" y1="160" x2="14" y2="192" stroke="#b8c5c1"/><circle cx="14" cy="209" r="14" fill="#fff" stroke="#aab8b4"/><text x="14" y="213" text-anchor="middle" class="small">4</text><text x="41" y="213" class="body">Test &amp; save</text></g><rect x="366" y="217" width="1016" height="628" fill="#fff"/><text x="412" y="270" class="h1">What should this mode do?</text><text x="412" y="294" class="body">Write the instruction in your own words. Built-in safety and anti-slop rules still apply.</text><text x="412" y="342" class="h2">Mode name</text><rect x="412" y="356" width="410" height="42" rx="8" fill="#fff" stroke="#cad3d0"/><text x="428" y="382" class="body">Clear client update</text><text x="412" y="443" class="h2">Instructions</text><rect x="412" y="457" width="700" height="177" rx="8" fill="#fff" stroke="#12ad89"/><text x="430" y="490" font-family="Arial" font-size="13" fill="#26332f"><tspan x="430" dy="0">Rewrite my project update for a client. Start with the current status, explain blockers in plain</tspan><tspan x="430" dy="22">English, and end with the next action and owner. Keep technical details that affect cost or</tspan><tspan x="430" dy="22">timing. Do not hide bad news or add reassurance I did not write.</tspan></text><text x="412" y="680" class="h2">Output behavior</text><rect x="412" y="696" width="158" height="39" rx="8" fill="#e9f8f3" stroke="#12ad89"/><text x="491" y="720" text-anchor="middle" class="small">Compare before replace</text><rect x="582" y="696" width="121" height="39" rx="8" fill="#fff" stroke="#d8dfdc"/><text x="642" y="720" text-anchor="middle" class="small">Review only</text><rect x="1146" y="757" width="190" height="44" rx="7" fill="#12ad89"/><text x="1241" y="784" text-anchor="middle" class="button white">Continue to guardrails</text></g><text x="16" y="888" font-family="Arial" font-size="10" fill="#55756b">DESIGN MOCKUP · NOT A RUNTIME SCREENSHOT</text></svg>