ass="tiny">Work profile</text><text x="283" y="129" text-anchor="end" class="tiny">⌘1</text></g><g transform="translate(662 425)"><rect width="312" height="147" rx="11" fill="#fff" stroke="#E9E0D4"/><circle cx="28" cy="29" r="15" fill="#FFF2DF"/><text x="28" y="34" text-anchor="middle" fill="#805200">!</text><text x="53" y="27" class="h2">Challenge my assumptions</text><text x="53" y="46" class="small">Full field · Review only</text><text x="18" y="81" class="body">Find unsupported leaps, missing context, and the</text><text x="18" y="100" class="body">strongest reasonable counterargument.</text><text x="18" y="129" class="tiny">Technical profile · Logic only</text></g><g transform="translate(992 425)"><rect width="312" height="147" rx="11" fill="#fff" stroke="#E9E0D4"/><circle cx="28" cy="29" r="15" fill="#EEF4FF"/><text x="28" y="34" text-anchor="middle" fill="#315B8A">→</text><text x="53" y="27" class="h2">Reply with a deadline</text><text x="53" y="46" class="small">Selection · Replace</text><text x="18" y="81" class="body">Write a polite but firm reply with the exact</text><text x="18" y="100" class="body">deadline already present in my draft.</text><text x="18" y="129" class="tiny">Work profile</text></g><text x="332" y="620" class="label">PROFILES</text><g transform="translate(332 642)"><rect width="472" height="116" rx="11" fill="#fff" stroke="#E9E0D4"/><g transform="translate(10.2 12.2) scale(0.0928)"><path fill="#A7472D" d="M256 52c-111 0-199 72-199 166 0 78 57 138 144 155l-14 65 84-60c103-7 184-78 184-168 0-88-88-158-199-158Z"/><path fill="#F0C764" d="M239 292c-32-7-60-37-62-77 38 6 72 33 85 62 7 15-7 23-23 15Z"/><path fill="#F0C764" d="M278 284c5-37 28-71 65-88 6 39-10 72-39 93-13 9-28 7-26-5Z"/><path fill="#F0C764" d="M245 303c10 7 25 11 40 6-4 17-16 31-33 40-9-13-12-30-7-46Z"/></g><text x="65" y="32" class="h2">Work</text><text x="65" y="50" class="small">Direct, clear, calm · British English</text><text x="18" y="88" class="tiny">4 voice samples · 12 