<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102c26" flood-opacity=".14"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbf7"/><stop offset="1" stop-color="#f8faf9"/></linearGradient></defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#172e29}.h1{font-size:22px;font-weight:700;fill:#1d2926}.h2{font-size:14px;font-weight:700;fill:#22332f}.body{font-size:12px;fill:#51625e}.small{font-size:10px;fill:#74817e}.tiny{font-size:8px;fill:#74817e}.green{fill:#0ca784}.white{fill:#fff}.label{font-size:9px;font-weight:700;letter-spacing:1px;fill:#0b8b70}.button{font-size:11px;font-weight:700}.mode{font-size:12px;font-weight:700;fill:#243430}</style><rect width="1440" height="900" fill="url(#bg)"/><circle cx="1340" cy="30" r="240" fill="#dff8f0"/><text x="58" y="64" class="label">WRITERIGHT V2 · DESIGN PREVIEW</text><text x="58" y="104" class="title">Your prompts and voice, organized</text><text x="58" y="131" class="body">Simple reusable prompts live alongside richer personal and work writing profiles.</text><g filter="url(#sh)"><rect x="58" y="165" width="1324" height="680" rx="18" fill="#fff"/><rect x="58" y="165" width="1324" height="52" rx="18" fill="#edf1f0"/><rect x="58" y="199" width="1324" height="18" fill="#edf1f0"/><circle cx="84" cy="191" r="6" fill="#ef6c67"/><circle cx="104" cy="191" r="6" fill="#f1bf4b"/><circle cx="124" cy="191" r="6" fill="#51bc77"/><rect x="173" y="179" width="865" height="25" rx="13" fill="#fff"/><text x="194" y="196" class="small">web.whatsapp.com</text><rect x="58" y="217" width="230" height="628" fill="#14352e"/><circle cx="94" cy="256" r="16" fill="#12b892"/><text x="94" y="262" text-anchor="middle" font-family="Georgia" font-style="italic" font-weight="700" fill="#fff">W</text><text x="120" y="261" font-size="14" font-weight="700" fill="#fff">WriteRight</text><text x="83" y="318" font-size="11" fill="#fff">Writing profiles</text><text x="83" y="357" font-size="11" fill="#8fa8a2">Modes</text><rect x="72" y="379" width="198" height="38" rx="8" fill="#235148"/><text x="84" y="403" font-size="11" fill="#fff">Prompt library</text><text x="83" y="447" font-size="11" fill="#8fa8a2">Dictionary</text><text x="83" y="487" font-size="11" fill="#8fa8a2">AI &amp; research</text><text x="83" y="527" font-size="11" fill="#8fa8a2">Privacy</text><rect x="288" y="217" width="1094" height="628" fill="#fbfcfc"/><text x="332" y="267" class="h1">Prompt library</text><text x="332" y="289" class="body">Save the instructions you use often. Pin any prompt to the in-page menu.</text><rect x="332" y="319" width="570" height="40" rx="8" fill="#fff" stroke="#d9dfdd"/><text x="351" y="344" class="small">⌕  Search prompts</text><rect x="1181" y="317" width="156" height="43" rx="7" fill="#12ad89"/><text x="1259" y="343" text-anchor="middle" class="button white">+ New prompt</text><text x="332" y="403" class="label">PINNED</text><g transform="translate(332 425)"><rect width="312" height="147" rx="11" fill="#fff" stroke="#dfe4e2"/><circle cx="28" cy="29" r="15" fill="#e9f8f3"/><text x="28" y="34" text-anchor="middle" fill="#0a9578">↘</text><text x="53" y="27" class="h2">Shorten without losing detail</text><text x="53" y="46" class="small">Selection · Compare first</text><text x="18" y="81" class="body">Cut repetition and filler while preserving every</text><text x="18" y="100" class="body">claim, constraint, and action item.</text><text x="18" y="129" class="tiny">Work profile</text><text x="283" y="129" text-anchor="end" class="tiny">⌘1</text></g><g transform="translate(662 425)"><rect width="312" height="147" rx="11" fill="#fff" stroke="#dfe4e2"/><circle cx="28" cy="29" r="15" fill="#fff2e3"/><text x="28" y="34" text-anchor="middle" fill="#c07816">!</text><text x="53" y="27" class="h2">Challenge my assumptions</text><text x="53" y="46" class="small">Full field · Review only</text><text x="18" y="81" class="body">Find unsupported leaps, missing context, and the</text><text x="18" y="100" class="body">strongest reasonable counterargument.</text><text x="18" y="129" class="tiny">Technical profile · Logic only</text></g><g transform="translate(992 425)"><rect width="312" height="147" rx="11" fill="#fff" stroke="#dfe4e2"/><circle cx="28" cy="29" r="15" fill="#eeeafd"/><text x="28" y="34" text-anchor="middle" fill="#7558c7">→</text><text x="53" y="27" class="h2">Reply with a deadline</text><text x="53" y="46" class="small">Selection · Replace</text><text x="18" y="81" class="body">Write a polite but firm reply with the exact</text><text x="18" y="100" class="body">deadline already present in my draft.</text><text x="18" y="129" class="tiny">Work profile</text></g><text x="332" y="620" class="label">PROFILES</text><g transform="translate(332 642)"><rect width="472" height="116" rx="11" fill="#fff" stroke="#dfe4e2"/><circle cx="34" cy="36" r="19" fill="#dff6ef"/><text x="34" y="41" text-anchor="middle" class="h2">W</text><text x="65" y="32" class="h2">Work</text><text x="65" y="50" class="small">Direct, clear, calm · British English</text><text x="18" y="88" class="tiny">4 voice samples · 12 protected terms · Gmail + LinkedIn</text></g><g transform="translate(824 642)"><rect width="472" height="116" rx="11" fill="#fff" stroke="#dfe4e2"/><circle cx="34" cy="36" r="19" fill="#fff0e1"/><text x="34" y="41" text-anchor="middle" class="h2">P</text><text x="65" y="32" class="h2">Personal</text><text x="65" y="50" class="small">Warm, concise, conversational</text><text x="18" y="88" class="tiny">2 voice samples · Contractions on · WhatsApp</text></g></g></svg>