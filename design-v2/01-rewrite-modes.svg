<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#35251F" flood-opacity=".14"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF5E9"/><stop offset="1" stop-color="#FFFCF7"/></linearGradient></defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#35251F}.h1{font-size:22px;font-weight:700;fill:#35251F}.h2{font-size:14px;font-weight:700;fill:#493A33}.body{font-size:12px;fill:#6B5E56}.small{font-size:10px;fill:#6B5E56}.tiny{font-size:8px;fill:#6B5E56}.green{fill:#9C412B}.white{fill:#fff}.label{font-size:9px;font-weight:700;letter-spacing:1px;fill:#7D3424}.button{font-size:11px;font-weight:700}.mode{font-size:12px;font-weight:700;fill:#493A33}</style><rect width="1440" height="900" fill="url(#bg)"/><circle cx="1340" cy="30" r="240" fill="#F3E2D9"/><text x="58" y="64" class="label">WORDSAFFRON V2 · DESIGN PREVIEW</text><text x="58" y="104" class="title">Rewrite without losing your voice</text><text x="58" y="131" class="body">Select text, choose a mode, and keep the original untouched until you approve.</text><g filter="url(#sh)"><rect x="58" y="165" width="1324" height="680" rx="18" fill="#fff"/><rect x="58" y="165" width="1324" height="52" rx="18" fill="#E9E0D4"/><rect x="58" y="199" width="1324" height="18" fill="#E9E0D4"/><circle cx="84" cy="191" r="6" fill="#ef6c67"/><circle cx="104" cy="191" r="6" fill="#f1bf4b"/><circle cx="124" cy="191" r="6" fill="#51bc77"/><rect x="173" y="179" width="865" height="25" rx="13" fill="#fff"/><text x="194" y="196" class="small">web.whatsapp.com</text><rect x="58" y="217" width="340" height="628" fill="#FFFCF7"/><text x="88" y="264" class="h1">Chats</text><rect x="82" y="284" width="290" height="38" rx="12" fill="#E9E0D4"/><circle cx="112" cy="364" r="23" fill="#D8CABB"/><text x="149" y="360" class="h2">Sarah · Product</text><text x="149" y="380" class="small">Can you confirm the release plan?</text><rect x="398" y="217" width="984" height="628" fill="#f6f2eb"/><rect x="398" y="217" width="984" height="58" fill="#FFFCF7"/><circle cx="431" cy="246" r="20" fill="#D8CABB"/><text x="463" y="250" class="h2">Sarah · Product</text><rect x="441" y="692" width="896" height="110" rx="13" fill="#fff"/><text x="470" y="729" class="body">I think we can ship Friday but the auth migration might cause issues and I dont want to promise.</text><text x="470" y="756" class="body">Maybe tell them its all good and we will handle anything that happens.</text><g transform="translate(1283.5 748.5) scale(0.0879)"><path fill="#A7472D" d="M256 52c-111 0-199 72-199 166 0 78 57 138 144 155l-14 65 84-60c103-7 184-78 184-168 0-88-88-158-199-158Z"/><path fill="#F0C764" d="M239 292c-32-7-60-37-62-77 38 6 72 33 85 62 7 15-7 23-23 15Z"/><path fill="#F0C764" d="M278 284c5-37 28-71 65-88 6 39-10 72-39 93-13 9-28 7-26-5Z"/><path fill="#F0C764" d="M245 303c10 7 25 11 40 6-4 17-16 31-33 40-9-13-12-30-7-46Z"/></g><rect x="464" y="710" width="517" height="25" rx="4" fill="#F3E2D9" opacity=".9"/><g filter="url(#sh)"><rect x="566" y="428" width="650" height="235" rx="14" fill="#fff"/><text x="592" y="460" class="small">Rewrite selected text</text><g transform="translate(592 482)"><rect width="112" height="70" rx="10" fill="#E8EFDC" stroke="#9C412B"/><circle cx="22" cy="21" r="11" fill="#9C412B"/><text x="22" y="25" text-anchor="middle" font-size="9" fill="#fff">✦</text><text x="14" y="47" class="mode">Polish</text><text x="14" y="62" class="tiny">Same voice, cleaner</text></g><g transform="translate(714 482)"><rect width="112" height="70" rx="10" fill="#fff" stroke="#E9E0D4"/><text x="14" y="29" class="mode">Casual</text><text x="14" y="49" class="tiny">Natural and easygoing</text></g><g transform="translate(836 482)"><rect width="112" height="70" rx="10" fill="#fff" stroke="#E9E0D4"/><text x="14" y="29" class="mode">Polite</text><text x="14" y="49" class="tiny">Respectful, still clear</text></g><g transform="translate(958 482)"><rect width="112" height="70" rx="10" fill="#fff" stroke="#E9E0D4"/><text x="14" y="26" class="mode">Professional</text><text x="14" y="42" class="mode">&amp; Firm</text><text x="14" y="59" class="tiny">Direct and confident</text></g><g transform="translate(1080 482)"><rect width="112" height="70" rx="10" fill="#fff" stroke="#E9E0D4"/><text x="14" y="26" class="mode">Technical</text><text x="14" y="42" class="mode">Review</text><text x="14" y="59" class="tiny">Logic + facts</text></g><line x1="592" y1="571" x2="1190" y2="571" stroke="#E9E0D4"/><text x="592" y="600" class="body">Profile</text><rect x="645" y="581" width="104" height="29" rx="14" fill="#E9E0D4"/><text x="697" y="600" text-anchor="middle" class="small">Work ▾</text><text x="777" y="600" class="body">Length</text><rect x="829" y="581" width="92" height="29" rx="14" fill="#E9E0D4"/><text x="875" y="600" text-anchor="middle" class="small">Same ▾</text><rect x="1096" y="577" width="96" height="36" rx="7" fill="#9C412B"/><text x="1144" y="600" text-anchor="middle" class="button white">Rewrite</text></g></g><text x="16" y="888" font-family="Arial" font-size="10" fill="#6B5E56">DESIGN MOCKUP · NOT A RUNTIME SCREENSHOT</text></svg>