<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102c26" flood-opacity=".14"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbf7"/><stop offset="1" stop-color="#f8faf9"/></linearGradient></defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#172e29}.h1{font-size:22px;font-weight:700;fill:#1d2926}.h2{font-size:14px;font-weight:700;fill:#22332f}.body{font-size:12px;fill:#51625e}.small{font-size:10px;fill:#74817e}.tiny{font-size:8px;fill:#74817e}.green{fill:#0ca784}.white{fill:#fff}.label{font-size:9px;font-weight:700;letter-spacing:1px;fill:#0b8b70}.button{font-size:11px;font-weight:700}.mode{font-size:12px;font-weight:700;fill:#243430}</style><rect width="1440" height="900" fill="url(#bg)"/><circle cx="1340" cy="30" r="240" fill="#dff8f0"/><text x="58" y="64" class="label">WRITERIGHT V2 · DESIGN PREVIEW</text><text x="58" y="104" class="title">Compare before you replace</text><text x="58" y="131" class="body">Meaning-preservation status, focused controls, explicit approval, and one-click undo.</text><g filter="url(#sh)"><rect x="58" y="165" width="1324" height="680" rx="18" fill="#fff"/><rect x="58" y="165" width="1324" height="52" rx="18" fill="#edf1f0"/><rect x="58" y="199" width="1324" height="18" fill="#edf1f0"/><circle cx="84" cy="191" r="6" fill="#ef6c67"/><circle cx="104" cy="191" r="6" fill="#f1bf4b"/><circle cx="124" cy="191" r="6" fill="#51bc77"/><rect x="173" y="179" width="865" height="25" rx="13" fill="#fff"/><text x="194" y="196" class="small">web.whatsapp.com</text><rect x="58" y="217" width="340" height="628" fill="#f7f9f8"/><text x="88" y="264" class="h1">Chats</text><rect x="82" y="284" width="290" height="38" rx="12" fill="#e9eeec"/><circle cx="112" cy="364" r="23" fill="#cce2dd"/><text x="149" y="360" class="h2">Sarah · Product</text><text x="149" y="380" class="small">Can you confirm the release plan?</text><rect x="398" y="217" width="984" height="628" fill="#f6f2eb"/><rect x="398" y="217" width="984" height="58" fill="#fbfcfc"/><circle cx="431" cy="246" r="20" fill="#cce2dd"/><text x="463" y="250" class="h2">Sarah · Product</text><rect x="441" y="692" width="896" height="110" rx="13" fill="#fff"/><text x="470" y="729" class="body">I think we can ship Friday but the auth migration might cause issues and I dont want to promise.</text><text x="470" y="756" class="body">Maybe tell them its all good and we will handle anything that happens.</text><circle cx="1306" cy="771" r="18" fill="#12b892"/><text x="1306" y="777" text-anchor="middle" font-family="Georgia" font-style="italic" font-weight="700" font-size="17" fill="#fff">W</text><g filter="url(#sh)"><rect x="860" y="245" width="486" height="560" rx="14" fill="#fff"/><circle cx="890" cy="277" r="16" fill="#12b892"/><text x="890" y="283" text-anchor="middle" font-family="Georgia" font-style="italic" font-weight="700" fill="#fff">W</text><text x="917" y="275" class="h2">Polish</text><text x="917" y="292" class="small">Work profile · Same length</text><path d="M1314 267l10 10m0-10l-10 10" stroke="#78837f"/><line x1="860" y1="310" x2="1346" y2="310" stroke="#e8ecea"/><text x="885" y="342" class="label">PROPOSED REWRITE</text><text x="885" y="374" font-family="Arial" font-size="14" fill="#26332f"><tspan x="885" dy="0">We can likely ship on Friday, but the authentication</tspan><tspan x="885" dy="22">migration still carries some risk. I would rather confirm</tspan><tspan x="885" dy="22">the migration first than make a promise we may not be able</tspan><tspan x="885" dy="22">to keep.</tspan></text><rect x="885" y="484" width="432" height="48" rx="8" fill="#f0f8f5"/><text x="900" y="504" class="small">Meaning preserved</text><text x="900" y="521" class="tiny">No claims, dates, or commitments were added.</text><text x="885" y="566" class="h2">Adjust rewrite</text><rect x="885" y="580" width="80" height="29" rx="14" fill="#e8f8f3"/><text x="925" y="599" text-anchor="middle" class="small">Shorter</text><rect x="973" y="580" width="80" height="29" rx="14" fill="#f2f4f4"/><text x="1013" y="599" text-anchor="middle" class="small">Simpler</text><rect x="1061" y="580" width="94" height="29" rx="14" fill="#f2f4f4"/><text x="1108" y="599" text-anchor="middle" class="small">More direct</text><text x="885" y="651" class="small">↻ Try again</text><text x="978" y="651" class="small">▣ Copy</text><rect x="1169" y="628" width="148" height="42" rx="7" fill="#12ad89"/><text x="1243" y="654" text-anchor="middle" class="button white">Replace selection</text><line x1="860" y1="699" x2="1346" y2="699" stroke="#e8ecea"/><text x="885" y="732" class="tiny">Original stays available for undo after replacement.</text></g></g><text x="16" y="888" font-family="Arial" font-size="10" fill="#55756b">DESIGN MOCKUP · NOT A RUNTIME SCREENSHOT</text></svg>