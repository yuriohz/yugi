<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#35251F" flood-opacity=".14"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF5E9"/><stop offset="1" stop-color="#FFFCF7"/></linearGradient></defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#35251F}.h1{font-size:22px;font-weight:700;fill:#35251F}.h2{font-size:14px;font-weight:700;fill:#493A33}.body{font-size:12px;fill:#6B5E56}.small{font-size:10px;fill:#6B5E56}.tiny{font-size:8px;fill:#6B5E56}.green{fill:#9C412B}.white{fill:#fff}.label{font-size:9px;font-weight:700;letter-spacing:1px;fill:#7D3424}.button{font-size:11px;font-weight:700}.mode{font-size:12px;font-weight:700;fill:#493A33}</style><rect width="1440" height="900" fill="url(#bg)"/><circle cx="1340" cy="30" r="240" fill="#F3E2D9"/><text x="58" y="64" class="label">WORDSAFFRON V2 · DESIGN PREVIEW</text><text x="58" y="104" class="title">Be accurate before being confident</text><text x="58" y="131" class="body">Logic review by default, optional researched review with citations and calibrated conclusions.</text><g filter="url(#sh)"><rect x="58" y="165" width="1324" height="680" rx="18" fill="#fff"/><rect x="58" y="165" width="1324" height="52" rx="18" fill="#E9E0D4"/><rect x="58" y="199" width="1324" height="18" fill="#E9E0D4"/><circle cx="84" cy="191" r="6" fill="#ef6c67"/><circle cx="104" cy="191" r="6" fill="#f1bf4b"/><circle cx="124" cy="191" r="6" fill="#51bc77"/><rect x="173" y="179" width="865" height="25" rx="13" fill="#fff"/><text x="194" y="196" class="small">web.whatsapp.com</text><rect x="58" y="217" width="825" height="628" fill="#FFFCF7"/><text x="100" y="268" class="small">DRAFT RESPONSE</text><rect x="100" y="288" width="730" height="240" rx="12" fill="#fff" stroke="#E9E0D4"/><text x="125" y="347" font-family="Arial" font-size="15" fill="#35251F">The API outage was definitely caused by the database migration.</text><text x="125" y="378" font-family="Arial" font-size="15" fill="#35251F">We should roll it back immediately. The vendor's status page proves</text><text x="125" y="409" font-family="Arial" font-size="15" fill="#35251F">their service was healthy, so there is no other possible cause.</text><rect x="100" y="553" width="730" height="80" rx="10" fill="#FFF2DF"/><text x="124" y="581" class="h2">Why are you sending this?</text><text x="124" y="603" class="body">Incident response · Internal engineering channel</text><rect x="58" y="217" width="0" height="0"/><g filter="url(#sh)"><rect x="883" y="217" width="499" height="628" fill="#fff"/><text x="915" y="259" class="h1">Technical Review</text><rect x="1188" y="237" width="161" height="35" rx="18" fill="#E8EFDC"/><text x="1268" y="259" text-anchor="middle" class="small">Research the web  ●</text><line x1="883" y1="288" x2="1382" y2="288" stroke="#E9E0D4"/><rect x="915" y="312" width="434" height="66" rx="9" fill="#fff2df"/><circle cx="941" cy="345" r="14" fill="#805200"/><text x="941" y="350" text-anchor="middle" font-size="12" fill="#fff">!</text><text x="968" y="338" class="h2">Conclusion is not yet supported</text><text x="968" y="357" class="small">Your direction may be right, but the evidence does not rule out other causes.</text><text x="915" y="416" class="label">LOGIC REVIEW</text><circle cx="927" cy="444" r="4" fill="#805200"/><text x="941" y="448" class="body">“Definitely caused” is stronger than the evidence provided.</text><circle cx="927" cy="476" r="4" fill="#805200"/><text x="941" y="480" class="body">A healthy vendor status page does not exclude partial or regional failure.</text><circle cx="927" cy="508" r="4" fill="#805200"/><text x="941" y="512" class="body">Immediate rollback needs risk and recovery-time comparison.</text><text x="915" y="552" class="label">EVIDENCE</text><rect x="915" y="568" width="434" height="69" rx="8" fill="#FFFCF7"/><text x="931" y="589" class="h2">Vendor incident history</text><text x="931" y="606" class="small">status.vendor.com · Supports service health, not database causation</text><text x="931" y="623" class="tiny">Open source ↗</text><rect x="915" y="650" width="434" height="69" rx="8" fill="#FFFCF7"/><text x="931" y="671" class="h2">Migration telemetry</text><text x="931" y="688" class="small">Internal context · Needed before assigning root cause</text><text x="931" y="705" class="tiny">Missing evidence</text><rect x="915" y="762" width="203" height="43" rx="7" fill="#E9E0D4"/><text x="1016" y="788" text-anchor="middle" class="button">Show safer direction</text><rect x="1129" y="762" width="220" height="43" rx="7" fill="#9C412B"/><text x="1239" y="788" text-anchor="middle" class="button white">Improve supported response</text></g></g><text x="16" y="888" font-family="Arial" font-size="10" fill="#6B5E56">DESIGN MOCKUP · NOT A RUNTIME SCREENSHOT</text></svg>