<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#102c26" flood-opacity=".14"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effbf7"/><stop offset="1" stop-color="#f8faf9"/></linearGradient></defs><style>text{font-family:Inter,Arial,sans-serif}.title{font-size:26px;font-weight:700;fill:#172e29}.h1{font-size:22px;font-weight:700;fill:#1d2926}.h2{font-size:14px;font-weight:700;fill:#22332f}.body{font-size:12px;fill:#51625e}.small{font-size:10px;fill:#74817e}.tiny{font-size:8px;fill:#74817e}.green{fill:#0ca784}.white{fill:#fff}.label{font-size:9px;font-weight:700;letter-spacing:1px;fill:#0b8b70}.button{font-size:11px;font-weight:700}.mode{font-size:12px;font-weight:700;fill:#243430}</style><rect width="1440" height="900" fill="url(#bg)"/><circle cx="1340" cy="30" r="240" fill="#dff8f0"/><text x="58" y="64" class="label">WRITERIGHT V2 · DESIGN PREVIEW</text><text x="58" y="104" class="title">Set the voice once, use it everywhere</text><text x="58" y="131" class="body">Personal and work profiles keep each mode consistent without flattening your style.</text><g filter="url(#sh)"><rect x="58" y="165" width="1324" height="680" rx="18" fill="#fff"/><rect x="58" y="165" width="1324" height="52" rx="18" fill="#edf1f0"/><rect x="58" y="199" width="1324" height="18" fill="#edf1f0"/><circle cx="84" cy="191" r="6" fill="#ef6c67"/><circle cx="104" cy="191" r="6" fill="#f1bf4b"/><circle cx="124" cy="191" r="6" fill="#51bc77"/><rect x="173" y="179" width="865" height="25" rx="13" fill="#fff"/><text x="194" y="196" class="small">web.whatsapp.com</text><rect x="58" y="217" width="270" height="628" fill="#14352e"/><circle cx="101" cy="263" r="19" fill="#12b892"/><text x="101" y="270" text-anchor="middle" font-family="Georgia" font-style="italic" font-weight="700" font-size="19" fill="#fff">W</text><text x="132" y="268" font-size="16" font-weight="700" fill="#fff">WriteRight</text><text x="93" y="347" font-size="11" fill="#9bb1ac">1  Connect your AI</text><text x="93" y="397" font-size="11" fill="#9bb1ac">2  Choose defaults</text><rect x="78" y="423" width="224" height="42" rx="8" fill="#235148"/><text x="93" y="449" font-size="11" fill="#fff">3  Teach your voice</text><text x="93" y="497" font-size="11" fill="#9bb1ac">4  Ready</text><text x="93" y="788" font-size="9" fill="#85a19a">Samples stay in Chrome local storage.</text><rect x="328" y="217" width="1054" height="628" fill="#fff"/><text x="390" y="285" class="label">STEP 3 OF 4</text><text x="390" y="329" class="title">Teach WriteRight how you sound</text><text x="390" y="356" class="body">Create profiles for different contexts. You can change or delete them at any time.</text><text x="390" y="410" class="h2">Profile</text><rect x="390" y="425" width="175" height="42" rx="9" fill="#e9f8f3" stroke="#12ad89"/><text x="477" y="451" text-anchor="middle" class="h2">Work</text><rect x="575" y="425" width="175" height="42" rx="9" fill="#fff" stroke="#d8dfdc"/><text x="662" y="451" text-anchor="middle" class="h2">Personal</text><rect x="760" y="425" width="175" height="42" rx="9" fill="#fff" stroke="#d8dfdc"/><text x="847" y="451" text-anchor="middle" class="h2">+ Add profile</text><text x="390" y="511" class="h2">Paste a few examples you wrote yourself</text><text x="390" y="532" class="small">Emails or messages you like work best. Remove private information first.</text><rect x="390" y="550" width="620" height="142" rx="9" fill="#fff" stroke="#cad3d0"/><text x="408" y="590" font-size="13" fill="#6b7874"><tspan x="408" dy="0">Paste 1–5 samples here. WriteRight learns your sentence rhythm,</tspan><tspan x="408" dy="22">level of directness, preferred terms, greetings, and sign-offs.</tspan><tspan x="408" dy="22">It will not copy facts from the samples.</tspan></text><rect x="1040" y="550" width="280" height="142" rx="9" fill="#f3f8f6"/><text x="1060" y="579" class="h2">Voice preview</text><text x="1060" y="608" class="small">Direct and calm</text><text x="1060" y="629" class="small">Uses contractions</text><text x="1060" y="650" class="small">Short opening sentences</text><text x="1060" y="671" class="small">No emoji · British English</text><rect x="1168" y="757" width="152" height="44" rx="7" fill="#12ad89"/><text x="1244" y="784" text-anchor="middle" class="button white">Save and continue</text></g><text x="16" y="888" font-family="Arial" font-size="10" fill="#55756b">DESIGN MOCKUP · NOT A RUNTIME SCREENSHOT</text></svg>